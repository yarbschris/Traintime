[package]
name = "traintime_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
traintime_server = { path = "../traintime_server", version = "0.1.0" }
ratatui = "0.30"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "sync", "time"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
